name: Locker refactor verification

on:
  pull_request:
    paths:
      - 'src/features/skins/**'
      - 'src/assets/capes/**'
      - 'src/components/ui/PlayerAvatar.jsx'
      - 'src/lib/skins.js'
      - 'test/skins.test.js'
      - 'scripts/fetch-official-capes.mjs'
      - '.github/workflows/locker-refactor.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate official cape textures
        run: node scripts/fetch-official-capes.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
